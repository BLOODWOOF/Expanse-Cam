<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cam ads</title>
  <style>
    :root { --bg: #18221a; --panel: #222f23; --line: #4d5a49; --text: #f1e6d3; --dim: #b5ab98; --red: #c4161c; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    p.sub { margin: 0 0 20px; color: var(--dim); }
    form, .ad { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
    form { display: grid; gap: 12px; margin-bottom: 24px; }
    label { display: grid; gap: 4px; color: var(--dim); font-size: 0.9rem; }
    input, select, textarea { font: inherit; color: var(--text); background: #111812; border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
    textarea { resize: vertical; min-height: 60px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { font: inherit; border: 0; border-radius: 4px; padding: 9px 14px; background: var(--red); color: #fff; cursor: pointer; justify-self: start; }
    button.plain { background: #3b403a; }
    #error { color: #ff8a8d; margin: 0; min-height: 1.5em; }
    .ad { display: grid; grid-template-columns: 120px 1fr auto; gap: 14px; align-items: center; margin-bottom: 10px; }
    .ad img { width: 120px; height: 80px; object-fit: cover; border-radius: 4px; background: #111; }
    .ad .meta { color: var(--dim); font-size: 0.85rem; }
    .ad.over { opacity: 0.5; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } .ad { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Cam ads</h1>
  <p class="sub">Only works on this PC. Four slots, two each side of the video. Newest ad in a slot wins, ads disappear after their end time.</p>

  <form id="add">
    <div class="row">
      <label>Slot
        <select name="slot">
          <option value="1">1 - left, top</option>
          <option value="2">2 - left, bottom</option>
          <option value="3">3 - right, top</option>
          <option value="4">4 - right, bottom</option>
        </select>
      </label>
      <label>Runs until
        <input name="ends" type="datetime-local" required>
      </label>
    </div>
    <label>Image (png, jpg, webp or gif, under 2 MB)
      <input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required>
    </label>
    <label>Text (up to 200 characters)
      <textarea name="text" maxlength="200" required></textarea>
    </label>
    <button>Add ad</button>
    <p id="error"></p>
  </form>

  <div id="list"></div>
</main>

<script>
const form = document.getElementById("add");
const list = document.getElementById("list");
const error = document.getElementById("error");

// default end: a week from now
const week = new Date(Date.now() + 7 * 86400e3);
form.ends.value = new Date(week - week.getTimezoneOffset() * 60e3).toISOString().slice(0, 16);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  error.textContent = "";
  const data = new FormData(form);
  // datetime-local has no timezone, send it as a real timestamp
  data.set("ends", new Date(form.ends.value).toISOString());
  const res = await fetch("/admin/ads", { method: "POST", body: data, redirect: "manual" }).catch(() => null);
  if (!res) return (error.textContent = "Couldn't reach the backend");
  if (res.status === 413) return (error.textContent = "That file is too big");
  if (res.status >= 400) return (error.textContent = (await res.json()).error);
  form.text.value = "";
  form.image.value = "";
  load();
});

async function load() {
  const ads = await (await fetch("/admin/ads")).json();
  list.replaceChildren();
  if (!ads.length) {
    const p = document.createElement("p");
    p.className = "sub";
    p.textContent = "No ads yet.";
    list.append(p);
  }
  for (const ad of ads.sort((a, b) => a.slot - b.slot || b.id - a.id)) {
    const over = ad.ends <= Date.now();
    const row = document.createElement("div");
    row.className = "ad" + (over ? " over" : "");
    const img = document.createElement("img");
    img.src = `/admin/ads/img/${ad.id}`;
    img.alt = "";
    const info = document.createElement("div");
    const text = document.createElement("div");
    text.textContent = ad.text;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `Slot ${ad.slot} · ${over ? "ended" : "until"} ${new Date(ad.ends).toLocaleString()}`;
    info.append(text, meta);
    const del = document.createElement("button");
    del.className = "plain";
    del.textContent = "Remove";
    del.onclick = async () => {
      await fetch(`/admin/ads/${ad.id}/delete`, { method: "POST", redirect: "manual" });
      load();
    };
    row.append(img, info, del);
    list.append(row);
  }
}
load();
</script>
</body>
</html>
