<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Expanse - Down for maintenance</title>
  <link rel="icon" href="logo.webp">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      color: #f1e6d3;
      font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(14, 20, 15, 0.78), rgba(14, 20, 15, 0.9)),
        #18221a url("banner.webp") center / cover;
    }
    main { text-align: center; max-width: 420px; }
    img { width: 96px; height: 96px; filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6)); }
    h1 { margin: 12px 0 6px; font-size: 1.5rem; }
    p { margin: 0; color: #b5ab98; }
  </style>
</head>
<body>
  <main>
    <img src="logo.webp" alt="">
    <h1>Stream's down for maintenance</h1>
    <p>Check back later.</p>
  </main>
</body>
</html>
